name: CI

on:
  push:
    branches: ["main"]
  pull_request:

# Minimal read-only permissions for all jobs in this workflow.
permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          args: "check"
      - uses: astral-sh/ruff-action@v3
        with:
          args: "format --check"

  basedpyright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install package and type-checker
        run: |
          pip install typing-extensions pytest
          pip install .
          pip install basedpyright
      - run: basedpyright --baselinemode=auto

  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test runner
        run: |
          pip install nanobind scikit-build-core
          pip install -e .
          pip install pytest
      - run: pytest

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and doc dependencies
        run: |
          pip install nanobind scikit-build-core
          pip install -e ".[docs]"
      - name: Build documentation
        run: sphinx-build -n --keep-going docs docs/_build/html
